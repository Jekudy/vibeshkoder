# Issue #521: existing volumes are external; never use down --volumes.
name: shkoder
services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE must be pinned}
    container_name: shkoder-bot
    command: [sh, -c, "alembic upgrade head && exec python -m bot"]
    env_file:
      - path: bot.env
        format: raw
    restart: unless-stopped
    cpu_shares: 1024
    volumes:
      - /srv/secrets/vibe-gatekeeper/credentials.json:/app/credentials.json
      - /srv/secrets/vibe-gatekeeper/digest-gold-examples.json:/run/secrets/digest-gold-examples.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: [coolify]
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be pinned}
    container_name: shkoder-web
    env_file:
      - path: web.env
        format: raw
    restart: unless-stopped
    cpu_shares: 1024
    volumes:
      - /srv/secrets/vibe-gatekeeper/credentials.json:/app/credentials.json
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    # Public routing is owned by the independent proxy file provider.
    networks: [coolify]
  db:
    image: ${DB_IMAGE:?DB_IMAGE must be pinned}
    container_name: shkoder-db
    env_file:
      - path: db.env
        format: raw
    restart: unless-stopped
    cpu_shares: 1024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "psql -U vibe -d vibe_gatekeeper -c 'SELECT 1' || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 5s
      retries: 10
    logging: *logging
    networks: [coolify]
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be pinned}
    container_name: shkoder-redis
    env_file:
      - path: redis.env
        format: raw
    command: [sh, -c, 'exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    restart: unless-stopped
    cpu_shares: 1024
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 60s
      timeout: 10s
      start_period: 5s
      retries: 10
    logging:
      driver: json-file
    networks: [coolify]
volumes:
  postgres-data:
    external: true
    name: postgres-data-hdazvm5fz836xj9mdyn8c629
  redis-data:
    external: true
    name: redis-data-gl28f0g5exzzo4k8w0auzygk
networks:
  coolify:
    external: true
