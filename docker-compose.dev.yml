# Dev compose — isolated postgres for memory pipeline testing.
# Port 5433 deliberately avoids clash with prod/staging (5432).
# Volume name suffixed -dev to avoid clash with existing volumes.
#
# Usage:
#   cp .env.dev.example .env.dev
#   # fill secrets in .env.dev
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d postgres-dev
#   alembic upgrade head
#   python -m bot
#
# Bot itself is run on the host so we can hot-iterate code; only the DB lives in compose.

services:
  postgres-dev:
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: shkoder-postgres-dev
    environment:
      POSTGRES_USER: shkoder_dev
      POSTGRES_PASSWORD: shkoder_dev
      POSTGRES_DB: shkoder_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - shkoder-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shkoder_dev", "-d", "shkoder_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j-dev:
    image: neo4j:5-community
    container_name: shkoder-neo4j-dev
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - shkoder-neo4j-dev:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-test_password_min_32_chars_for_neo4j_5}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-test_password_min_32_chars_for_neo4j_5} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  shkoder-postgres-dev:
  shkoder-neo4j-dev:
