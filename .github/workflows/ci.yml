name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  postgres-image-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: pip install -e .

      - name: Build production-compatible PostgreSQL image
        run: docker build --file Dockerfile.postgres --tag shkoder-postgres:ci .

      - name: Verify PostgreSQL and pgvector
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name shkoder-postgres-smoke \
            --env POSTGRES_USER=vibe \
            --env POSTGRES_PASSWORD=smoke-only \
            --env POSTGRES_DB=vibe_gatekeeper \
            --publish 55432:5432 \
            shkoder-postgres:ci
          trap 'docker rm --force shkoder-postgres-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec shkoder-postgres-smoke \
              pg_isready -h 127.0.0.1 -U vibe -d vibe_gatekeeper >/dev/null; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          test "${postgres_ready:-false}" = "true"
          docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION vector;'
          vector_version=$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT extversion FROM pg_extension WHERE extname='vector'")
          test "$vector_version" = "0.8.2"
          postgres_major=$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT current_setting('server_version_num')::integer / 10000")
          test "$postgres_major" = "15"
          cosine_distance=$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT '[1,0,0]'::vector <=> '[1,0,0]'::vector")
          test "$cosine_distance" = "0"

          export DATABASE_URL=postgresql+asyncpg://vibe:smoke-only@127.0.0.1:55432/vibe_gatekeeper
          alembic upgrade 090
          alembic downgrade 089
          alembic upgrade head
          test "$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT version_num FROM alembic_version")" = "091"
          test "$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT count(*) FROM information_schema.columns \
               WHERE table_schema='public' AND table_name='semantic_qa_attempts' \
                 AND column_name='delivery_started_at'")" = "1"
          test "$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT count(*) FROM information_schema.columns \
               WHERE table_schema='public' AND data_type='jsonb' \
                 AND (table_name, column_name) IN ( \
                   ('semantic_index_runs','reason_counts'), \
                   ('semantic_retrieval_traces','candidate_ranks'), \
                   ('semantic_retrieval_traces','result_source_ids'))")" = "3"
          test "$(docker exec shkoder-postgres-smoke \
            psql -U vibe -d vibe_gatekeeper -Atqc \
              "SELECT count(*) FROM pg_constraint \
               WHERE conname IN ('ck_llm_usage_ledger_nonnegative_usage', \
                                 'ck_semantic_attempts_state') AND convalidated")" = "2"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vibe_gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe -d vibe_gatekeeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password-min-32-chars-ok!
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      BOT_TOKEN: 123456:test-token
      COMMUNITY_CHAT_ID: -1001234567890
      ADMIN_IDS: '[149820031]'
      # Postgres service is reachable on localhost:5432 from the runner.
      DATABASE_URL: postgresql+asyncpg://vibe:changeme@localhost:5432/vibe_gatekeeper
      TEST_DATABASE_URL: postgresql+asyncpg://vibe:changeme@localhost:5432/vibe_gatekeeper
      REDIS_URL: redis://redis:6379/0
      GOOGLE_SHEETS_CREDS_FILE: ""
      GOOGLE_SHEET_ID: ""
      WEB_BASE_URL: http://localhost:8080
      WEB_BOT_USERNAME: vibeshkoder_dev_bot
      DB_PASSWORD: changeme
      WEB_PASSWORD: test-pass
      WEB_SESSION_SECRET: test-session-secret
      DEV_MODE: "true"
      NEO4J_BOLT_URI: bolt://localhost:7687
      NEO4J_AUTH_USER: neo4j
      NEO4J_AUTH_PASSWORD: ci-test-password-min-32-chars-ok!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,healing]"

      - name: Run alembic migrations against the test postgres
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Run lint
        run: ruff check .

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.161.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: >
          semgrep scan --error
          --config p/python
          --config p/security-audit
          --config p/secrets
          .
