name: Ops — Fix credentials.json perms

# One-shot maintenance workflow. Manually triggered.
# Fixes Sheets sync regression introduced by non-root container (26ee7d4, 2026-04-26):
# /srv/secrets/vibe-gatekeeper/credentials.json on host is mode 0400 root:root,
# unreadable by container uid 10001 (appuser).
#
# Runner user is uid=1002(runner), no sudo, but member of `docker` group.
# Strategy: docker-exec a throwaway root container with the host secrets dir
# bind-mounted, run setfacl (preferred) or chmod (fallback) inside. The docker
# daemon executes the container as root, which lets us chmod a root-owned host file.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose | fix"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - fix

permissions:
  contents: read

jobs:
  fix-perms:
    runs-on: [self-hosted, shkoder-vps]
    timeout-minutes: 5
    env:
      HOST_FILE: /srv/secrets/vibe-gatekeeper/credentials.json
      HOST_DIR: /srv/secrets/vibe-gatekeeper
      CONTAINER_UID: "10001"
    steps:
      - name: Diagnose current state (host view)
        shell: bash
        run: |
          set +e
          echo "=== runner identity ==="
          id
          echo
          echo "=== host file stat ==="
          if [ -e "$HOST_FILE" ]; then
            stat "$HOST_FILE"
          else
            echo "MISSING: $HOST_FILE"
            exit 1
          fi
          echo
          echo "=== host dir stat ==="
          stat "$HOST_DIR" 2>&1 | sed -n '1,5p' || echo "(cannot stat dir as runner — likely 0700 root)"

      - name: Diagnose via docker (root view inside throwaway container)
        shell: bash
        run: |
          set -e
          docker run --rm \
            -v "${HOST_DIR}":/secrets:ro \
            alpine:3.20 sh -c '
              echo "=== container identity ==="
              id
              echo
              echo "=== /secrets dir ==="
              ls -la /secrets
              echo
              echo "=== /secrets/credentials.json ==="
              stat /secrets/credentials.json
              echo
              echo "=== sample uid 10001 read test (su-exec) ==="
              apk add --no-cache su-exec >/dev/null
              su-exec 10001:10001 cat /secrets/credentials.json >/dev/null 2>&1 && echo "uid 10001 CAN read" || echo "uid 10001 CANNOT read"
            '

      - name: Diagnose via real bot container (ground truth, runs as appuser)
        shell: bash
        run: |
          set +e
          BOT_CONTAINER=$(docker ps --filter "ancestor=ghcr.io/jekudy/vibe-gatekeeper-bot:main" --format '{{.Names}}' | head -1)
          if [ -z "$BOT_CONTAINER" ]; then
            BOT_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'vibe-gatekeeper|shkoder' | head -1)
          fi
          echo "bot_container=$BOT_CONTAINER"
          if [ -z "$BOT_CONTAINER" ]; then
            echo "no running bot container found — skipping live verify"
            exit 0
          fi
          echo "=== bot container user ==="
          docker exec "$BOT_CONTAINER" id
          echo "=== bot reads /app/credentials.json ==="
          docker exec "$BOT_CONTAINER" sh -c 'head -c 1 /app/credentials.json >/dev/null && echo "OK readable" || echo "STILL NOT READABLE"'

      - name: Apply fix via docker (setfacl preferred, chmod fallback)
        if: ${{ inputs.mode == 'fix' }}
        shell: bash
        run: |
          set -e
          # Mount RW so we can change perms. The container runs as root via docker daemon,
          # which lets it chmod the root-owned host file.
          docker run --rm \
            -v "${HOST_DIR}":/secrets \
            -e CONTAINER_UID="${CONTAINER_UID}" \
            alpine:3.20 sh -ec '
              apk add --no-cache acl >/dev/null
              echo "=== before ==="
              stat /secrets/credentials.json
              echo
              echo "=== applying setfacl u:${CONTAINER_UID}:r ==="
              if setfacl -m u:"${CONTAINER_UID}":r /secrets/credentials.json; then
                echo "setfacl OK"
              else
                echo "setfacl failed, falling back to chmod o+r"
                chmod o+r /secrets/credentials.json
                echo "chmod OK"
              fi
              echo
              echo "=== after ==="
              stat /secrets/credentials.json
              echo
              getfacl /secrets/credentials.json || true
              echo
              echo "=== verify uid 10001 can read (su-exec) ==="
              apk add --no-cache su-exec >/dev/null
              su-exec 10001:10001 cat /secrets/credentials.json >/dev/null && echo "OK — uid 10001 now reads" || { echo "STILL CANNOT READ — check dir traversal perms"; exit 1; }
            '

      - name: Verify via real bot container (ground truth)
        if: ${{ inputs.mode == 'fix' }}
        shell: bash
        run: |
          set -e
          BOT_CONTAINER=$(docker ps --filter "ancestor=ghcr.io/jekudy/vibe-gatekeeper-bot:main" --format '{{.Names}}' | head -1)
          if [ -z "$BOT_CONTAINER" ]; then
            BOT_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'vibe-gatekeeper|shkoder' | head -1)
          fi
          if [ -z "$BOT_CONTAINER" ]; then
            echo "no running bot container — cannot verify in production. Fix applied to host file; bot will pick it up on next sync."
            exit 0
          fi
          echo "verifying inside $BOT_CONTAINER"
          docker exec "$BOT_CONTAINER" id
          docker exec "$BOT_CONTAINER" sh -c 'head -c 1 /app/credentials.json >/dev/null && echo "OK — bot container can now read credentials.json"'
