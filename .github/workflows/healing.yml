name: Autonomous Healing

on:
  workflow_dispatch:
    inputs:
      signal_payload:
        description: "JSON payload emitted by the composite healthcheck"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: healing-singleton
  cancel-in-progress: false

jobs:
  healing:
    runs-on: [self-hosted, shkoder-vps]
    timeout-minutes: 45
    env:
      SIGNAL_PAYLOAD: ${{ inputs.signal_payload }}
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      HEALING_BOT_CONTAINER: ${{ vars.HEALING_BOT_CONTAINER }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      DATABASE_URL_RO: ${{ secrets.DATABASE_URL_RO }}
      HEALING_ENV_KEY: ${{ secrets.HEALING_ENV_KEY }}
      GH_TOKEN: ${{ secrets.HEALING_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python venv (system python; setup-python@v5 has no prebuilt for Ubuntu 25.10)
        run: |
          python3 --version
          # Venv must NOT live in /tmp: systemd-tmpfiles ages out files >10d by
          # atime, deleting package .py sources while __pycache__/dist-info
          # survive — pip then reports "already satisfied" but imports resolve
          # to empty namespace packages (incident 2026-06-01: httpx lost
          # Client/HTTPError and every healthcheck run failed).
          VENV_DIR="$HOME/healing-venv"
          if [ -x "$VENV_DIR/bin/python" ] && ! "$VENV_DIR/bin/python" -c "import httpx, psycopg; httpx.Client; httpx.HTTPError" >/dev/null 2>&1; then
            echo "::warning::venv at $VENV_DIR is broken — dumping httpx state and recreating"
            ls -la "$VENV_DIR"/lib/python*/site-packages/httpx/ 2>&1 || true
            rm -rf "$VENV_DIR"
          fi
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/pip" install --upgrade pip
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -e ".[dev,healing]"

      - name: Configure git identity for state branch
        run: |
          git config user.name "healing-bot[bot]"
          git config user.email "healing-bot@users.noreply.github.com"

      - name: Run autonomous healing orchestrator
        run: python -m ops.healing.orchestrator --signal-payload "$SIGNAL_PAYLOAD"
