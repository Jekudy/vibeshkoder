name: Evals

on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: vibe_gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe -d vibe_gatekeeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password-min-32-chars-ok!
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      BOT_TOKEN: 123456:test-token
      COMMUNITY_CHAT_ID: -1001234567890
      ADMIN_IDS: '[149820031]'
      DATABASE_URL: postgresql+asyncpg://vibe:changeme@localhost:5432/vibe_gatekeeper
      REDIS_URL: redis://redis:6379/0
      GOOGLE_SHEETS_CREDS_FILE: ""
      GOOGLE_SHEET_ID: ""
      WEB_BASE_URL: http://localhost:8080
      WEB_BOT_USERNAME: vibeshkoder_dev_bot
      DB_PASSWORD: changeme
      WEB_PASSWORD: test-pass
      WEB_SESSION_SECRET: test-session-secret
      DEV_MODE: "true"
      NEO4J_BOLT_URI: bolt://localhost:7687
      NEO4J_AUTH_USER: neo4j
      NEO4J_AUTH_PASSWORD: ci-test-password-min-32-chars-ok!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,healing]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run privacy and semantic eval contract tests
        shell: bash
        run: |
          set +e
          EVAL_HARNESS_ENABLED=1 timeout 300 pytest -x --timeout=60 \
            tests/evals/ \
            tests/services/test_semantic_eval.py \
            tests/scripts/test_evaluate_semantic_qa.py \
            tests/scripts/test_run_semantic_qa_eval.py \
            tests/scripts/test_postgres_image_contract.py
          eval_status=$?
          set -e
          python - "$eval_status" <<'PY'
          import json
          import os
          import sys

          exit_code = int(sys.argv[1])
          payload = {
              "schema_version": 1,
              "suite": "privacy-and-semantic-eval-contract-tests",
              "status": "pass" if exit_code == 0 else "fail",
              "exit_code": exit_code,
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "contains_raw_text": False,
          }
          with open("eval_results.jsonl", "w", encoding="utf-8") as target:
              target.write(json.dumps(payload, sort_keys=True) + "\n")
          PY
          exit "$eval_status"

      - name: Validate sanitized private frozen eval report
        shell: bash
        env:
          SEMANTIC_EVAL_REPORT_JSON: ${{ secrets.SEMANTIC_EVAL_REPORT_JSON }}
        run: |
          python -m scripts.evaluate_semantic_qa validate-report \
            --expected-release-sha "$GITHUB_SHA" \
            --artifact eval_results.jsonl

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.jsonl
          if-no-files-found: error
