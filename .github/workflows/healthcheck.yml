name: Healing Healthcheck

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
    steps:
      - name: Check public HTTPS independently of the VPS runner (#521)
        shell: bash
        run: |
          [[ "$PUBLIC_HEALTH_URL" == https://* ]] || { echo "::error::PUBLIC_HEALTH_URL must use HTTPS"; exit 1; }
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 10 --max-time 20 "$PUBLIC_HEALTH_URL" \
            | jq -e '.status == "ok"' > /dev/null

  healthcheck:
    runs-on: [self-hosted, shkoder-vps]
    timeout-minutes: 5
    env:
      PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check applications, database, Telegram and public HTTPS (#521)
        shell: bash
        run: |
          set -o pipefail
          python3 ops/compose/healthcheck.py | tee healthcheck-report.json
      - name: Preserve health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-report
          path: healthcheck-report.json
