name: Implementation Work
description: Define a concrete unit of development before creating a branch or worktree.
title: "[dev] "
labels: []
body:
  - type: dropdown
    id: work-type
    attributes:
      label: Work Type
      options:
        - Feature
        - Bug fix
        - Refactor
        - Infrastructure
        - Documentation
        - Test / quality
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem does this work solve, and why now?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and excluded.
      placeholder: |
        Included:
        - ...

        Excluded:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Objective, testable done-criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Plan
      description: Tests, checks, or evidence that will prove the acceptance criteria.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source / Design Issue
      description: Link the Discovery/RFC issue or ADR that produced this task, if any.
      placeholder: "#123 or N/A"

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue numbers or PR links this work depends on. Use N/A if none.
      placeholder: "#42, #57, or N/A"
    validations:
      required: true

  - type: checkboxes
    id: issue-first
    attributes:
      label: Issue-first gate
      options:
        - label: No branch, worktree, or implementation change was created before this issue.
          required: true
        - label: The work is within `AUTHORIZED_SCOPE.md` when that document applies.
          required: true
